name: Academy staging browser QA

on:
  workflow_dispatch:

# This suite tests an existing backend; it does not deploy the application.
# Run it manually against a configured test environment. An unconfigured cron
# created failing GitHub deployment records on every weekday.

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Validate staging configuration
        env:
          ACADEMY_BASE_URL: ${{ vars.ACADEMY_BASE_URL }}
          ACADEMY_API_URL: ${{ vars.ACADEMY_API_URL }}
          ACADEMY_OWNER_EMAIL: ${{ secrets.ACADEMY_OWNER_EMAIL }}
          ACADEMY_OWNER_PASSWORD: ${{ secrets.ACADEMY_OWNER_PASSWORD }}
        run: |
          missing=0
          for name in ACADEMY_BASE_URL ACADEMY_API_URL ACADEMY_OWNER_EMAIL ACADEMY_OWNER_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure $name in repository Actions settings before running QA."
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:academy:staging
        env:
          E2E_BASE_URL: ${{ vars.ACADEMY_BASE_URL }}
          E2E_API_URL: ${{ vars.ACADEMY_API_URL }}
          E2E_OWNER_EMAIL: ${{ secrets.ACADEMY_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.ACADEMY_OWNER_PASSWORD }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: academy-staging-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
