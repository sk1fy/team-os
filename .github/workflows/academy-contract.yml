name: Academy OpenAPI contract

on:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Backend git ref containing the contract
        required: true
        default: main
  repository_dispatch:
    types: [backend-contract-updated]
  schedule:
    - cron: '17 3 * * *'

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend
      - uses: actions/checkout@v4
        with:
          repository: sk1fy/team-os-backend
          ref: ${{ inputs.backend_ref || github.event.client_payload.backend_ref || 'main' }}
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run contract:check -- ../backend/contracts/openapi/teamos.yaml
        working-directory: frontend
